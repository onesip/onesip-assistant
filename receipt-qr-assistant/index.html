<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OneSip Receipt & QR Assistant</title></head><body><p style="font-family:system-ui;padding:24px">Loading OneSip Receipt & QR Assistant…</p><script>(async()=>{const files=["parts/part01.txt","parts/part02.txt","parts/part03.txt","parts/part04.txt","parts/part05.txt","parts/part06.txt","parts/part07.txt"];const b=(await Promise.all(files.map(async f=>{const r=await fetch(f);if(!r.ok)throw new Error(`Could not load ${f}`);return r.text()}))).join("");const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const s=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text();document.open();document.write(s);document.close()})().catch(e=>{document.body.innerHTML=`<main style="font-family:system-ui;padding:24px"><h2>Unable to load the app</h2><p>${e.message}</p><button onclick="location.reload()">Try again</button></main>`})</script></body></html>
